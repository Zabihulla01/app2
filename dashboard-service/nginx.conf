# WebSocket upgrade map — required for proxy_set_header Connection $connection_upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Static frontend files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → backtest service on port 8008
    # Supports both HTTP and WebSocket (wss://) connections
    location /api/ {
        # Use Docker's internal DNS so hostname is resolved per-request (not cached at startup)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backtest_upstream http://backtest:8008;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $backtest_upstream;
        proxy_http_version 1.1;

        # ── WebSocket upgrade support ──────────────────────────────────────
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        # ──────────────────────────────────────────────────────────────────

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout    3600s;   # keep WebSocket alive (1 hour)
        proxy_connect_timeout  30s;    # was 10s — CoinGecko can be slow
        proxy_send_timeout    300s;    # allow long-running API responses
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # Handle OPTIONS preflight
    location = /api/ {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        return 204;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
