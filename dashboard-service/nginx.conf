server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # Static frontend files
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/* → backtest service on port 8008
    # This lets the browser use /api/backtest/BTC-USD instead of http://IP:8008/backtest/BTC-USD
    location /api/ {
        # Use Docker's internal DNS so hostname is resolved per-request (not cached at startup)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backtest_upstream http://backtest:8008;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $backtest_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
    }

    # Handle OPTIONS preflight
    location = /api/ {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        return 204;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
