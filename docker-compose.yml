services:

  indicator:
    build: ./indicator-service
    ports:
      - "8001:8001"

  risk:
    build: ./risk-service
    ports:
      - "8002:8002"

  pattern:
    build: ./pattern-service
    ports:
      - "8003:8003"

  prediction:
    build: ./prediction-service
    ports:
      - "8004:8004"

  confidence:
    build: ./confidence-service
    ports:
      - "8005:8005"

  decision:
    build: ./decision-service
    ports:
      - "8006:8006"

  alert:
    build: ./alert-service
    ports:
      - "8007:8007"

  gateway:
    build: ./gateway-service
    ports:
      - "8000:8000"
  backtest:
     build: ./backtest-service
     ports:
       - "8008:8008"
     volumes:
       - ./data:/data

  dashboard-service:
    build: ./dashboard-service
    ports:
      - "8080:80"
    depends_on:
      - backtest

